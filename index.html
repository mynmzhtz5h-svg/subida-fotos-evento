<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subí tu foto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* LOGO ARRIBA */
    .logo-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .logo-container img {
      width: 220px;
      max-width: 70vw;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      margin-top: 120px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      background: #111;
      color: #fff;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;

      background: linear-gradient(135deg, #00c853, #2979ff);
      box-shadow: 0 8px 26px rgba(0, 160, 255, 0.45);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 34px rgba(0, 200, 120, 0.6);
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }

    .estado {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo">
  </div>

  <!-- FORM -->
  <div class="container">
    <input id="nombre" type="text" placeholder="Tu nombre">
    <textarea id="mensaje" placeholder="Mensaje (opcional)"></textarea>
    <input id="foto" type="file" accept="image/*">

    <button id="btn">Subir foto</button>
    <div class="estado" id="estado"></div>
  </div>

<!-- ⚠️ SCRIPT COMO MODULE (OBLIGATORIO) -->
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://mjmbvzvirvtsihtyrqqf.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const btn = document.getElementById("btn");
  const estado = document.getElementById("estado");

  function limpiarTexto(t) {
    return t
      .trim()
      .replace(/[^a-zA-Z0-9ñÑ _-]/g, "")
      .replace(/\s+/g, "_");
  }

  btn.onclick = async () => {
    estado.textContent = "";
    btn.disabled = true;

    const nombre = document.getElementById("nombre").value || "Anonimo";
    const mensaje = document.getElementById("mensaje").value || "";
    const archivo = document.getElementById("foto").files[0];

    if (!archivo) {
      estado.textContent = "Seleccioná una foto";
      btn.disabled = false;
      return;
    }

    const n = limpiarTexto(nombre);
    const m = limpiarTexto(mensaje);
    const ext = archivo.name.split(".").pop();
    const ts = Date.now();

    const nombreArchivo = encodeURIComponent(
      `${n}___${m}___${ts}.${ext}`
    );

    try {
      const { error } = await supabase
        .storage
        .from("evento")
        .upload(nombreArchivo, archivo);

      if (error) throw error;

      estado.textContent = "Foto enviada ✔";
      document.getElementById("foto").value = "";
      document.getElementById("mensaje").value = "";

    } catch (e) {
      console.error(e);
      estado.textContent = "Error al subir la foto";
    }

    btn.disabled = false;
  };
</script>

</body>
</html>
