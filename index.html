<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subí tu foto</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0a0a0a, #111);
    font-family: system-ui, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 92vw;
    max-width: 420px;
    background: #141414;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .logo {
    text-align: center;
    margin-bottom: 10px;
  }

  .logo img {
    width: 70%;
    max-width: 240px;
  }

  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0;
  }

  p {
    text-align: center;
    font-size: 14px;
    opacity: 0.85;
    margin: 0 0 10px;
  }

  label {
    font-size: 13px;
    opacity: 0.85;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"],
  input[type="file"] {
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
  }

  input[type="file"] {
    background: white;
    color: black;
  }

  button {
    margin-top: 10px;
    padding: 14px;
    border-radius: 16px;
    border: none;
    background: #22c55e; /* verde */
    color: #000;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .mensaje {
    text-align: center;
    font-size: 15px;
    min-height: 22px;
    margin-top: 6px;
  }
</style>
</head>

<body>

<div class="card">

  <!-- LOGO -->
  <div class="logo">
    <img src="logo.png" alt="craneos.uy">
  </div>

  <h1>Subí tu foto 📸</h1>
  <p>Aparecerá en la pantalla del evento</p>

  <!-- FORMULARIO CON JS -->
  <label>
    Tu nombre
    <input type="text" id="nombre" required placeholder="Ej: Ana">
  </label>

  <label>
    Mensaje (opcional)
    <input type="text" id="mensaje" placeholder="Ej: Tremenda noche">
  </label>

  <label>
    Foto
    <input type="file" id="fileInput" accept="image/*" required>
  </label>

  <button id="btn">Subir foto</button>
  <div class="mensaje" id="mensajeEstado"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.0/axios.min.js"></script>
<script>
  // === CONFIGURA TU CLOUDINARY ===
  const cloudName = "craneosuy"; // Reemplaza con tu cloud name
  const unsignedUploadPreset = "evento_qr"; // Reemplaza con tu preset sin firmar
  const folder = "evento-qr"; // Carpeta en Cloudinary

  const btn = document.getElementById("btn");
  const estado = document.getElementById("mensajeEstado");
  const nombreInput = document.getElementById("nombre");
  const mensajeInput = document.getElementById("mensaje");
  const fileInput = document.getElementById("fileInput");

  btn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) {
      estado.textContent = "Selecciona una foto primero";
      return;
    }

    const nombre = nombreInput.value.trim().replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
    const mensaje = mensajeInput.value.trim().replace(/\s+/g, "_").replace(/[^\w\-]/g, "");
    const timestamp = Date.now();
    const publicId = `${nombre}___${mensaje}___${timestamp}`;

    btn.disabled = true;
    estado.textContent = "Subiendo foto…";

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", unsignedUploadPreset);
    formData.append("folder", folder);
    formData.append("public_id", publicId);

    try {
      const res = await axios.post(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, formData);
      estado.textContent = "✅ Tu foto se subió con éxito. ¡Mirá la pantalla!";
      nombreInput.value = "";
      mensajeInput.value = "";
      fileInput.value = "";
      btn.disabled = false;
      console.log("URL de la foto:", res.data.secure_url);
    } catch (err) {
      console.error(err);
      estado.textContent = "❌ Error subiendo la foto. Intenta de nuevo.";
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
