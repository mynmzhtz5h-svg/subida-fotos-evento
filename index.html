<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subí tu foto</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0a0a0a, #111);
    font-family: system-ui, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 92vw;
    max-width: 420px;
    background: #141414;
    padding: 28px;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .logo {
    text-align: center;
    margin-bottom: 10px;
  }

  .logo img {
    width: 70%;
    max-width: 240px;
  }

  h1 {
    font-size: 20px;
    text-align: center;
    margin: 0;
  }

  p {
    text-align: center;
    font-size: 14px;
    opacity: 0.85;
    margin: 0 0 10px;
  }

  label {
    font-size: 13px;
    opacity: 0.85;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"],
  input[type="file"] {
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
  }

  input[type="file"] {
    background: white;
    color: black;
  }

  button {
    margin-top: 10px;
    padding: 14px;
    border-radius: 16px;
    border: none;
    background: #22c55e;
    color: #000;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .mensaje {
    text-align: center;
    font-size: 15px;
    min-height: 22px;
    margin-top: 6px;
  }
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="logo.png" alt="logo">
  </div>

  <h1>Subí tu foto 📸</h1>
  <p>Aparecerá en la pantalla del evento</p>

  <label>
    Tu nombre
    <input type="text" id="nombre" placeholder="Ej: Ana">
  </label>

  <label>
    Mensaje (opcional)
    <input type="text" id="mensaje" placeholder="Ej: Tremenda noche">
  </label>

  <label>
    Foto
    <input type="file" id="foto" accept="image/*" required>
  </label>

  <button id="btn">Subir foto</button>

  <div class="mensaje" id="estado"></div>
</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://mjmbvzvirvtsihtyrqqf.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const btn = document.getElementById("btn");
  const estado = document.getElementById("estado");

  function limpiarTexto(texto) {
    return texto
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9_-]/g, "");
  }

  btn.onclick = async () => {
    const nombre = document.getElementById("nombre").value.trim();
    const mensaje = document.getElementById("mensaje").value.trim();
    const fileInput = document.getElementById("foto");
    const file = fileInput.files[0];

    if (!file) {
      alert("Seleccioná una foto");
      return;
    }

    btn.disabled = true;
    estado.textContent = "Subiendo foto…";

    const nombreLimpio = limpiarTexto(nombre || "anonimo");
    const mensajeLimpio = limpiarTexto(mensaje || "sinmensaje");
    const timestamp = Date.now();
    const extension = file.name.split(".").pop();

    const fileName = `${nombreLimpio}___${mensajeLimpio}___${timestamp}.${extension}`;

    const { error } = await supabase
      .storage
      .from("evento")
      .upload(fileName, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (error) {
      console.error(error);
      estado.textContent = "❌ Error al subir la foto";
      btn.disabled = false;
      return;
    }

    estado.textContent = "✅ ¡Foto subida! Mirá la pantalla 👀";
    fileInput.value = "";
    btn.disabled = false;
  };
</script>

</body>
</html>
