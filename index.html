<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subí tu foto al evento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #111;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 30px rgba(0,0,0,.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
    }

    input, textarea, button {
      width: 100%;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input, textarea {
      background: #222;
      color: #fff;
    }

    button {
      background: #00e0ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>📸 Subí tu foto</h1>

    <input type="text" id="nombre" placeholder="Tu nombre" maxlength="30" />
    <textarea id="mensaje" placeholder="Mensaje (opcional)" maxlength="60"></textarea>
    <input type="file" id="foto" accept="image/*" />
    <button id="btn">Subir foto</button>

    <div class="msg" id="estado"></div>
  </div>

<script>
  // ==============================
  // 🔑 SUPABASE CONFIG
  // ==============================
  const SUPABASE_URL = "https://mjmbvzvirvtsihtyrqqf.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const btn = document.getElementById("btn");
  const estado = document.getElementById("estado");

  // ==============================
  // 🧼 LIMPIEZA DE TEXTO (ACEPTA Ñ)
  // ==============================
  function limpiarTexto(texto) {
    return texto
      .trim()
      .replace(/[^a-zA-Z0-9ñÑ _-]/g, "")
      .replace(/\s+/g, "_");
  }

  // ==============================
  // 🚀 SUBIDA
  // ==============================
  btn.onclick = async () => {
    estado.textContent = "";
    btn.disabled = true;

    const nombre = document.getElementById("nombre").value || "Anonimo";
    const mensaje = document.getElementById("mensaje").value || "";
    const archivo = document.getElementById("foto").files[0];

    if (!archivo) {
      estado.textContent = "❌ Seleccioná una foto";
      btn.disabled = false;
      return;
    }

    const nombreLimpio = limpiarTexto(nombre);
    const mensajeLimpio = limpiarTexto(mensaje);

    const extension = archivo.name.split(".").pop();
    const timestamp = Date.now();

    const rawFileName =
      `${nombreLimpio}___${mensajeLimpio}___${timestamp}.${extension}`;

    // 🔐 CLAVE: encodea el nombre (permite Ñ sin error)
    const fileName = encodeURIComponent(rawFileName);

    try {
      const { error } = await supabase
        .storage
        .from("evento")
        .upload(fileName, archivo, {
          cacheControl: "3600",
          upsert: false
        });

      if (error) throw error;

      estado.textContent = "✅ Foto subida con éxito";
      document.getElementById("foto").value = "";
      document.getElementById("mensaje").value = "";

    } catch (err) {
      console.error(err);
      estado.textContent = "❌ Error al subir la foto";
    }

    btn.disabled = false;
  };
</script>
</body>
</html>
