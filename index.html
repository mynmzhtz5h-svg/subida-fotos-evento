<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subí tu foto al evento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #000, #111);
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #0f0f0f;
      padding: 28px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      text-align: center;
    }

    img.logo {
      width: 180px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    input, textarea {
      background: #1a1a1a;
      color: #fff;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      background: #ffffff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:active {
      transform: scale(.98);
    }

    .estado {
      margin-top: 16px;
      font-size: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="logo.png" class="logo" alt="Logo">

    <h1>Subí tu foto al evento 📸</h1>

    <input type="file" id="foto" accept="image/*" />
    <input type="text" id="nombre" placeholder="Tu nombre" />
    <textarea id="mensaje" placeholder="Mensaje (opcional)"></textarea>

    <button id="btn">Subir foto</button>

    <div class="estado" id="estado"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // 🔐 SUPABASE
    const supabase = createClient(
      "https://mjmbvzvirvtsihtyrqqf.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU"
    );

    const btn = document.getElementById("btn");
    const estado = document.getElementById("estado");

    btn.onclick = async () => {
      const fileInput = document.getElementById("foto");
      const nombre = document.getElementById("nombre").value.trim();
      const mensaje = document.getElementById("mensaje").value.trim();

      if (!fileInput.files.length || !nombre) {
        estado.textContent = "⚠️ Seleccioná una foto y escribí tu nombre";
        return;
      }

      btn.disabled = true;
      estado.textContent = "Subiendo foto… ⏳";

      const file = fileInput.files[0];
      const safeNombre = nombre.replace(/\s+/g, "_");
      const safeMensaje = mensaje.replace(/\s+/g, "_");

      const fileName =
        `${safeNombre}___${safeMensaje}___${Date.now()}.${file.name.split('.').pop()}`;

      const { error } = await supabase
        .storage
        .from("fotos-evento")
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: false
        });

      if (error) {
        console.error(error);
        estado.textContent = "❌ Error al subir la foto";
        btn.disabled = false;
        return;
      }

      estado.textContent = "✅ Foto subida con éxito";
      fileInput.value = "";
      document.getElementById("mensaje").value = "";
      btn.disabled = false;
    };
  </script>

</body>
</html>
