<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subí tu foto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    img.logo {
      max-width: 220px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      background: #111;
      color: #fff;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;

      background: linear-gradient(135deg, #00c853, #2979ff);
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
      box-shadow: 0 8px 24px rgba(0, 150, 255, 0.35);
    }

    button:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(0, 200, 120, 0.45);
    }

    button:disabled {
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }

    .estado {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="logo.png" class="logo" alt="Logo">

    <input id="nombre" type="text" placeholder="Tu nombre">
    <textarea id="mensaje" placeholder="Mensaje (opcional)"></textarea>
    <input id="foto" type="file" accept="image/*">

    <button id="btn">Subir foto</button>
    <div class="estado" id="estado"></div>
  </div>

<script>
  // ======================
  // SUPABASE
  // ======================
  const SUPABASE_URL = "https://mjmbvzvirvtsihtyrqqf.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const btn = document.getElementById("btn");
  const estado = document.getElementById("estado");

  // ======================
  // Limpieza (acepta Ñ)
  // ======================
  function limpiarTexto(t) {
    return t
      .trim()
      .replace(/[^a-zA-Z0-9ñÑ _-]/g, "")
      .replace(/\s+/g, "_");
  }

  // ======================
  // SUBIR FOTO
  // ======================
  btn.onclick = async () => {
    estado.textContent = "";
    btn.disabled = true;

    const nombre = document.getElementById("nombre").value || "Anonimo";
    const mensaje = document.getElementById("mensaje").value || "";
    const archivo = document.getElementById("foto").files[0];

    if (!archivo) {
      estado.textContent = "Seleccioná una foto";
      btn.disabled = false;
      return;
    }

    const n = limpiarTexto(nombre);
    const m = limpiarTexto(mensaje);
    const ext = archivo.name.split(".").pop();
    const ts = Date.now();

    const rawName = `${n}___${m}___${ts}.${ext}`;
    const safeName = encodeURIComponent(rawName);

    try {
      const { error } = await supabase
        .storage
        .from("evento")
        .upload(safeName, archivo, { upsert: false });

      if (error) throw error;

      estado.textContent = "Foto enviada ✔";
      document.getElementById("foto").value = "";
      document.getElementById("mensaje").value = "";

    } catch (e) {
      console.error(e);
      estado.textContent = "Error al subir la foto";
    }

    btn.disabled = false;
  };
</script>
</body>
</html>
