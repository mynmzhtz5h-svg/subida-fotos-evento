<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Subí tu foto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #111, #000);
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #0e0e0e;
      padding: 28px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      text-align: center;
    }

    img {
      width: 180px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 14px;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    input, textarea {
      background: #1a1a1a;
      color: #fff;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      background: linear-gradient(135deg, #00c853, #2979ff);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .estado {
      margin-top: 14px;
      min-height: 20px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="card">
  <img src="logo.png" alt="Logo">
  <h1>Subí tu foto al evento 📸</h1>

  <input type="file" id="foto" accept="image/*">
  <input type="text" id="nombre" placeholder="Tu nombre">
  <textarea id="mensaje" placeholder="Mensaje (opcional)"></textarea>

  <button id="btn">Subir foto</button>
  <div class="estado" id="estado"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://mjmbvzvirvtsihtyrqqf.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWJ2enZpcnZ0c2lodHlycXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2NDk2ODUsImV4cCI6MjA4NTIyNTY4NX0.ZHo3Tsi2GwJFvW3iwOKBQ6c_6KhHx2Ju8wUrU223zkU"
  );

  const btn = document.getElementById("btn");
  const estado = document.getElementById("estado");

  // 🔐 FUNCIÓN CLAVE
  function limpiarTexto(texto) {
    return texto
      .normalize("NFD")                     // separa acentos
      .replace(/[\u0300-\u036f]/g, "")     // elimina acentos
      .replace(/[^a-zA-Z0-9ñÑ_-]/g, "")    // solo caracteres seguros
      .replace(/\s+/g, "_")
      .substring(0, 40) || "anonimo";
  }

  btn.onclick = async () => {
    const fileInput = document.getElementById("foto");
    const nombreRaw = document.getElementById("nombre").value;
    const mensajeRaw = document.getElementById("mensaje").value;

    if (!fileInput.files.length || !nombreRaw.trim()) {
      estado.textContent = "⚠️ Foto y nombre obligatorios";
      return;
    }

    btn.disabled = true;
    estado.textContent = "Subiendo foto… ⏳";

    const file = fileInput.files[0];

    const nombre = limpiarTexto(nombreRaw);
    const mensaje = limpiarTexto(mensajeRaw);
    const ext = file.name.split(".").pop().toLowerCase();

    const fileName =
      `${nombre}___${mensaje}___${Date.now()}.${ext}`;

    try {
      const { error } = await supabase
        .storage
        .from("evento")
        .upload(fileName, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (error) throw error;

      estado.textContent = "✅ Foto subida correctamente";
      fileInput.value = "";
      document.getElementById("mensaje").value = "";

    } catch (e) {
      console.error(e);
      estado.textContent = "❌ Error al subir la foto";
    }

    btn.disabled = false;
  };
</script>

</body>
</html>
